<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f6fd0'/%3E%3Cpath d='M8 13h16v7a2 2 0 0 1-2 2h-5l-4 4v-4h-3a2 2 0 0 1-2-2z' fill='white'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Notify — an event-driven notification platform with preference-aware routing, digest batching, frequency caps and realtime WebSocket delivery."
    />
    <title>Notify · Event-driven notification platform</title>
    <script>
      /*
       * Resolves the theme before first paint so the page never flashes the wrong colors
       * (spec §27). Kept inline and tiny on purpose: it must run before the CSS applies,
       * and it cannot depend on any module having loaded.
       */
      (function () {
        try {
          var stored = localStorage.getItem('rtns.theme-preference') || 'system';
          var dark =
            stored === 'dark' ||
            (stored === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.classList.toggle('dark', dark);
          root.dataset.theme = dark ? 'dark' : 'light';
          root.style.colorScheme = dark ? 'dark' : 'light';
        } catch (error) {
          /* storage or matchMedia unavailable: default light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
