<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <!--
      Brand mark, inlined to save a request. Kept in sync with
      src/components/brand/BrandMark.tsx and public/favicon.svg — this was previously a
      generic bell, which did not match either of those.
    -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='t' x1='4' y1='3' x2='28' y2='30' gradientUnits='userSpaceOnUse'%3E%3Cstop stop-color='%236178FB'/%3E%3Cstop offset='1' stop-color='%231B3A8F'/%3E%3C/linearGradient%3E%3CradialGradient id='s' cx='0' cy='0' r='1' gradientTransform='translate(10 8) rotate(48) scale(24)'%3E%3Cstop stop-color='%23fff' stop-opacity='.32'/%3E%3Cstop offset='1' stop-color='%23fff' stop-opacity='0'/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23t)'/%3E%3Crect width='32' height='32' rx='9' fill='url(%23s)'/%3E%3Cpath d='M10.3 23.4V9.2L21.8 23.4V9.2' stroke='%23fff' stroke-width='3.1' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='24.5' cy='8.7' r='2.3' fill='%238FE3FF'/%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Notify — an event-driven notification platform with preference-aware routing, digest batching, frequency caps and realtime WebSocket delivery."
    />
    <title>Notify · Event-driven notification platform</title>
    <script>
      /*
       * Resolves the theme before first paint so the page never flashes the wrong colors
       * (spec §27). Kept inline and tiny on purpose: it must run before the CSS applies,
       * and it cannot depend on any module having loaded.
       */
      (function () {
        try {
          var stored = localStorage.getItem('rtns.theme-preference') || 'system';
          var dark =
            stored === 'dark' ||
            (stored === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.classList.toggle('dark', dark);
          root.dataset.theme = dark ? 'dark' : 'light';
          root.style.colorScheme = dark ? 'dark' : 'light';
        } catch (error) {
          /* storage or matchMedia unavailable: default light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
