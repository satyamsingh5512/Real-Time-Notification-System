<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    Notify brand mark. Kept byte-identical in geometry to
    src/components/brand/BrandMark.tsx so the favicon and the in-app mark can never
    drift apart. Replaces the purple lightning bolt that shipped with the Vite scaffold,
    which was off-brand (wrong colour, unrelated shape, and not even the icon that
    index.html was using).
  -->
  <defs>
    <linearGradient id="tile" x1="4" y1="3" x2="28" y2="30" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6178FB"/>
      <stop offset="1" stop-color="#1B3A8F"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0" cy="0" r="1" gradientTransform="translate(10 8) rotate(48) scale(24)">
      <stop stop-color="#fff" stop-opacity=".32"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="32" height="32" rx="9" fill="url(#tile)"/>
  <rect width="32" height="32" rx="9" fill="url(#sheen)"/>
  <path d="M10.3 23.4V9.2L21.8 23.4V9.2" stroke="#fff" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="24.5" cy="8.7" r="2.3" fill="#8FE3FF"/>
</svg>