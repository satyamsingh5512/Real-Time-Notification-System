# Shared response security headers.
#
# WHY THIS IS A SEPARATE FILE
# --------------------------
# nginx's `add_header` is all-or-nothing per context level: if a `location` block
# declares ANY `add_header`, it inherits NONE from the server block. Every SPA route
# is served through an internal redirect to `/index.html`, so the headers must be
# repeated inside that location too — otherwise the app ships with no CSP at all.
#
# A bug of exactly this shape shipped once already: adding `Cache-Control: no-cache`
# to `location = /index.html` silently stripped the Content-Security-Policy from
# every page. Including this snippet in both the server block and each location that
# declares its own `add_header` makes that impossible to reintroduce.
#
# `always` so the headers are present on error responses too, not just 2xx.
#
# Directives are explicit rather than inherited from `default-src`, because the app
# self-hosts its font and serves its own assets. Enforcing, not report-only.
# 'unsafe-inline' is retained for exactly two things: the pre-paint theme script in
# index.html (it must run before any module loads) and React inline style attributes.
# There is NO 'unsafe-eval' anywhere — verified zero eval/new Function in src/, and
# the production bundle does not use it.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;