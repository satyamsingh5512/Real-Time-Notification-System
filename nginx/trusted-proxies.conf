# Optional: trust a reverse proxy sitting in front of this nginx.
#
# WHY THIS FILE EXISTS
# `limit_req_zone $binary_remote_addr ...` in nginx.prod.conf buckets requests by the
# socket peer address. With no proxy in front that is the real client and everything is
# correct. Put an OCI Load Balancer, Cloudflare, or another proxy in front and every
# socket peer becomes the proxy's IP, so ALL clients share a single bucket:
#   /auth  is limited to 5r/s burst=10
# One shared 5r/s bucket means the login endpoint locks out every user the moment a
# handful of people sign in together. It looks like a login bug, not a proxy bug.
#
# HOW TO ENABLE
#   1. Find the proxy's real client-facing CIDR:
#        OCI LB:      the VCN subnet CIDR, e.g. 10.0.0.0/24
#        Cloudflare:  173.245.48.0/20, 103.21.244.0/22, 103.22.200.0/22,
#                     103.31.4.0/22, 141.101.64.0/18, 108.162.192.0/18,
#                     190.93.240.0/20, 188.114.96.0/20, 197.234.240.0/22,
#                     198.41.128.0/17, 162.158.0.0/15, 104.16.0.0/13, 104.24.0.0/14
#   2. Uncomment the line below and substitute that CIDR.
#   3. Restart nginx:  docker compose -f docker-compose.prod.yml restart nginx
#
# TRUST ONLY PROXIES YOU CONTROL. `set_real_ip_from 0.0.0.0/0` lets any client forge
# X-Forwarded-For and bypass every rate limit in the config.
#
# This file is intentionally empty by default: no reverse proxy is assumed, which keeps
# $remote_addr correct for the direct-DNS-to-VM topology.

# set_real_ip_from 10.0.0.0/24;
# real_ip_header X-Forwarded-For;
# real_ip_recursive on;