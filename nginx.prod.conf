# Production edge config for docker-compose.prod.yml (nginx service).
#
# THIS FILE IS A TEMPLATE. The official nginx image runs envsubst over
# /etc/nginx/templates/*.template and writes the result to /etc/nginx/conf.d/.
# It is rendered at container start from the NGINX_* variables in .env
# (NGINX_SERVER_NAME, NGINX_TLS_CERT_PATH, NGINX_TLS_KEY_PATH).
#
#   docker compose -f docker-compose.prod.yml up -d   # renders + starts
#   docker compose -f docker-compose.prod.yml exec nginx cat /etc/nginx/conf.d/default.conf
#
# CRITICAL: NGINX_ENVSUBST_FILTER=NGINX_ is set in docker-compose.prod.yml. It restricts
# substitution to NGINX_* names so that nginx's own runtime variables ($host,
# $remote_addr, $request_uri, the log_format fields) survive untouched. All template
# variables here are therefore deliberately prefixed NGINX_. Do not "simplify" a name to
# $DOMAIN or $CERT — without the filter it renders empty and nginx will not start.

limit_req_zone $binary_remote_addr zone=api_hot:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth_strict:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=ws_conn:10m;

upstream backend {
    server notification-platform:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# Plain HTTP: redirect everything to HTTPS (except ACME challenges).
server {
    listen 80;
    server_name ${NGINX_SERVER_NAME};

    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    # Container-local liveness. Deliberately NOT redirected: the Docker HEALTHCHECK
    # probes http://localhost/health, and following the 301 would send it to https
    # with no SNI/cert match and mark a healthy container as unhealthy.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name ${NGINX_SERVER_NAME};

    # Reverse-proxy support. Empty by default (see nginx/trusted-proxies.conf); when a
    # load balancer is placed in front this makes $remote_addr the real client IP so the
    # limit_req zones above bucket per client instead of per proxy.
    include /etc/nginx/snippets/trusted-proxies.conf;

    # --- TLS ---------------------------------------------------------------
    # Cert paths come from .env. nginx refuses to start when they are unreadable, which
    # is intentional — it fails loudly rather than silently serving plaintext.
    ssl_certificate ${NGINX_TLS_CERT_PATH};
    ssl_certificate_key ${NGINX_TLS_KEY_PATH};
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Shared snippet; see nginx/security-headers.conf. Repeated inside every
    # location that declares its own add_header, because nginx discards the
    # inherited set there — and every SPA route lands in `location = /index.html`.
    include /etc/nginx/snippets/security-headers.conf;
    # No second Content-Security-Policy here: two CSP headers make the browser enforce
    # the intersection of both, which is fragile to reason about. HSTS above already
    # handles upgrade enforcement in production.

    client_max_body_size 1m;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend http://backend;

    # Content-hashed Vite output: safe to cache for a year.
    location /assets/ {
        root /usr/share/nginx/html;
        # `expires 1y` is deliberately NOT used alongside this: it emits its own
        # Cache-Control, so using both produced two conflicting headers on every asset.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
    }

    # The entry document must revalidate so a deploy is picked up immediately.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Backend probes. Without this, deploy.sh's /health/ready gate resolved to the
    # SPA fallback (HTTP 200 from index.html) and passed with a dead backend.
    location /health/ {
        access_log off;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location ~ ^/api/v1/auth/(login|register) {
        limit_req zone=auth_strict burst=10 nodelay;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Scoped CSP relaxation for Swagger UI only, rather than a global exemption.
    location /swagger-ui {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'" always;
    }

    location /v3/api-docs {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    location /actuator/health {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    location ~ ^/api/v1/(notifications|internal|admin/broadcast) {
        limit_req zone=api_hot burst=40 nodelay;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /ws/ {
        limit_conn ws_conn 20;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
