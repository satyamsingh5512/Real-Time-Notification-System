# RTNS edge proxy: serves the React SPA, proxies API + WebSocket to the backend.
# Rate-limits the notification hot paths at the edge (defense in depth behind
# the in-app RateLimitFilter).

limit_req_zone $binary_remote_addr zone=api_hot:10m rate=20r/s;

server {
    listen 80;
    server_name _;

    # Docker embedded DNS; `set` + variable proxy_pass defers upstream resolution
    # to request time so nginx also boots when the backend is (temporarily) absent.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend http://notification-platform:8080;

    # SPA (React build output)
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Backend REST API (incl. Swagger UI + actuator health)
    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /swagger-ui {
        proxy_pass $backend;
        proxy_set_header Host $host;
    }

    location /v3/api-docs {
        proxy_pass $backend;
        proxy_set_header Host $host;
    }

    location /actuator/health {
        proxy_pass $backend;
        proxy_set_header Host $host;
    }

    # Notification hot paths: edge rate limit on top of the in-app limiter.
    location ~ ^/api/v1/(notifications|internal|admin/broadcast) {
        limit_req zone=api_hot burst=40 nodelay;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket handshake (JWT travels as ?token=, validated by WebSocketAuthInterceptor).
    location /ws/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
