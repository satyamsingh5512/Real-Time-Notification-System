# RTNS edge proxy: serves the React SPA, proxies API + WebSocket to the backend.
# Rate-limits the notification hot paths at the edge (defense in depth behind
# the in-app RateLimitFilter). HTTP-only dev variant; see nginx.prod.conf for TLS.

limit_req_zone $binary_remote_addr zone=api_hot:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth_strict:10m rate=5r/s;

# WebSocket connections need a large concurrent allowance but still bounded.
limit_conn_zone $binary_remote_addr zone=ws_conn:10m;

upstream backend {
    server notification-platform:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Docker embedded DNS; `set` + variable proxy_pass defers upstream resolution
    # to request time so nginx also boots when the backend is (temporarily) absent.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend http://backend;

    # --- Security headers -------------------------------------------------
    # Shared snippet; see nginx/security-headers.conf for why it must also be
    # repeated inside every location that declares its own add_header.
    include /etc/nginx/snippets/security-headers.conf;

    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    # woff2 is already compressed; listing it here would waste CPU for no size win.
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    access_log /var/log/nginx/access.log combined;

    # Vite emits content-hashed filenames into /assets, so those bytes can never
    # change under the same URL — cache them for a year.
    location /assets/ {
        root /usr/share/nginx/html;
        # `expires 1y` is deliberately NOT used alongside this: it emits its own
        # Cache-Control, so using both produced two conflicting headers on every asset.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # This block declares add_header, so the inherited set is discarded — re-include.
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
    }

    # The HTML document itself must never be cached, or a deploy keeps serving the
    # previous bundle's asset references until the entry expires.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache" always;
        # Every SPA route is served via an internal redirect to /index.html, so the
        # CSP has to be present here or no page carries one at all.
        include /etc/nginx/snippets/security-headers.conf;
    }

    # SPA (React build output)
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Container-local liveness for the nginx service itself. Returns ok even when the
    # backend is down — use /health/ready below for backend state.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Backend health probes, proxied. deploy.sh and smoke_test.sh gate on
    # /health/ready; without this block that path fell through to the SPA fallback
    # and returned index.html with a 200, so the deploy "health gate" passed even
    # with a dead backend.
    location /health/ {
        access_log off;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend REST API (incl. Swagger UI + actuator health)
    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Auth endpoints: stricter edge limit (brute-force protection) + in-app limiter.
    location ~ ^/api/v1/auth/(login|register) {
        limit_req zone=auth_strict burst=10 nodelay;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger UI ships inline scripts/styles, so it gets a scoped CSP that mirrors the
    # app's rather than being exempted globally.
    location /swagger-ui {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Scoped relaxation for Swagger UI only, rather than a global exemption.
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'" always;
    }

    location /v3/api-docs {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    location /actuator/health {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    # Notification hot paths: edge rate limit on top of the in-app limiter.
    location ~ ^/api/v1/(notifications|internal|admin/broadcast) {
        limit_req zone=api_hot burst=40 nodelay;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket handshake (JWT travels as ?token=, validated by WebSocketAuthInterceptor).
    # Long-lived: no buffering, long timeouts, limited concurrent conns per IP.
    location /ws/ {
        limit_conn ws_conn 20;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
