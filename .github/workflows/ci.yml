name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile
        run: ./gradlew compileJava compileTestJava --no-daemon

      - name: Frontend install
        run: |
          cd frontend
          npm ci --no-audit --no-fund

      - name: Frontend lint
        run: cd frontend && npm run lint

      - name: Frontend typecheck + build
        run: cd frontend && npm run build

      - name: Install Playwright Chromium
        run: cd frontend && npx playwright install --with-deps chromium

      # Assertions only: layout overflow, keyboard/focus behaviour, console errors and
      # WCAG AA contrast over the shader. Screenshot comparison is a separate, opt-in
      # job below, because baselines are only stable on a pinned runner image.
      - name: Frontend behaviour + accessibility assertions
        run: |
          cd frontend
          npx playwright test \
            --grep-invert "landing —|login$|register$|dashboard —|dashboard$|notification centre|delivery preferences|^.* settings|system status|admin console|notification drawer|command palette —|command palette$|mass email — audience preview|inbox — dark|nothing delivered|API unavailable|hero viewport only"

      - name: Upload visual report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-visual-report
          path: frontend/test-results/visual-report
          retention-days: 7

      - name: Run unit + integration tests
        run: ./gradlew test --no-daemon
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

      - name: Publish test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests"
          retention-days: 7

      - name: Aggregate JaCoCo coverage
        run: ./gradlew jacocoTestReport --no-daemon

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: "**/build/reports/jacoco"
          retention-days: 7

      - name: Validate compose files
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.prod.yml config -q

      - name: Build bootJar
        run: ./gradlew :api:bootJar -x test --no-daemon

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: notification-platform-jar
          path: api/build/libs/notification-platform.jar

  # Opt in from the Actions tab ("Re-run with workflow_dispatch") or change the trigger
  # once the baselines are trusted on a pinned runner image. Font rasterisation differs
  # between runner images, so pixel diffs are not meaningful without pinning.
  visual-regression:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Frontend install
        run: cd frontend && npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Visual regression
        run: cd frontend && npm run test:visual

      - name: Upload diff artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff
          path: |
            frontend/test-results
            frontend/tests/visual/__screenshots__
          retention-days: 7

  delivery-verification:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Asserts CSP + security headers on every SPA route, immutable asset caching,
      # SPA fallback, the backend health proxy, and that Node is absent at runtime.
      - name: Verify nginx delivery guarantees
        run: chmod +x scripts/*.sh && ./scripts/verify_delivery.sh

  docker-build-push:
    needs: [build-and-test, delivery-verification]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ARM64-compatible: Oracle Ampere is aarch64. QEMU+Buildx builds both arches
      # from the same Dockerfile (all base images are multi-arch; Kafka is now
      # apache/kafka KRaft instead of amd64-only Confluent).
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-build-push-frontend:
    needs: [build-and-test, delivery-verification]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push nginx+frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}-frontend:latest
            ghcr.io/${{ github.repository }}-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-oracle:
    needs: [docker-build-push, docker-build-push-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH (zero-broken-deploy with rollback)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.VPS_DEPLOY_DIR || '/opt/rtns' }}
            git pull --ff-only || true
            chmod +x scripts/*.sh
            ./scripts/deploy.sh
            ./scripts/smoke_test.sh http://localhost
