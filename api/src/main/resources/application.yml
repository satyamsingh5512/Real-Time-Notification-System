spring:
  application:
    name: notification-platform
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:notification_platform}
    username: ${DB_USER:notification_user}
    password: ${DB_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  threads:
    # Java 21 virtual threads: WebSocket fan-out and provider I/O are IO-bound and
    # blocking, so virtual threads scale connection count without pool tuning
    # (Spring docs: task-execution-and-scheduling -> virtual-threads).
    virtual:
      enabled: ${VIRTUAL_THREADS_ENABLED:true}

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: notification-platform

security:
  jwt:
    secret: ${JWT_SECRET:CHANGE_ME_IN_PRODUCTION_use_a_32+_byte_random_secret}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}

notification:
  email:
    # AWS SES, used when notification.email-service.enabled is false (the default).
    from-address: ${SES_FROM_ADDRESS:no-reply@example.com}
    aws-region: ${AWS_REGION:us-east-1}
  # External email-service microservice (github.com/satyamsingh5512/email-service) used
  # as the EMAIL delivery transport. Disabled by default; enabling it makes it the
  # primary EMAIL provider and leaves SES unused. See docs/EMAIL_SERVICE_INTEGRATION.md.
  email-service:
    enabled: ${EMAIL_SERVICE_ENABLED:false}
    base-url: ${EMAIL_SERVICE_URL:http://email-service:3001}
    api-key: ${EMAIL_SERVICE_API_KEY:}
    connect-timeout-ms: ${EMAIL_SERVICE_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${EMAIL_SERVICE_READ_TIMEOUT_MS:10000}
    # Mass-email campaigns are OFF by default: highest abuse risk in the product, and the
    # upstream service enforces a hardcoded 100 sends/day quota.
    mass-mail-enabled: ${EMAIL_SERVICE_MASS_MAIL_ENABLED:false}
    mass-mail-max-recipients: ${EMAIL_SERVICE_MASS_MAIL_MAX_RECIPIENTS:100}
    # Mirrors the upstream constant so the pre-flight quota warning is accurate.
    daily-quota: ${EMAIL_SERVICE_DAILY_QUOTA:100}
  sms:
    from-number: ${TWILIO_FROM_NUMBER:+10000000000}
    twilio-account-sid: ${TWILIO_ACCOUNT_SID:}
    twilio-auth-token: ${TWILIO_AUTH_TOKEN:}
  push:
    firebase-credentials-path: ${FIREBASE_CREDENTIALS_PATH:classpath:firebase-service-account.json}
  scheduler:
    poll-interval-ms: 10000
  alerting:
    # Generic webhook (Slack incoming webhook / PagerDuty / custom on-call endpoint).
    # Empty = alerting disabled (log + metrics only).
    webhook-url: ${DLQ_ALERT_WEBHOOK_URL:}
  retention:
    enabled: ${NOTIFICATION_RETENTION_ENABLED:true}
    days: ${NOTIFICATION_RETENTION_DAYS:90}
    cron: ${NOTIFICATION_RETENTION_CRON:0 0 2 * * *}
  digest:
    # Slack/SuprSend-style batching: low-value email is batched per user and
    # flushed as one grouped email. Cadence itself is per-user (user_preferences.digest_cadence).
    enabled: ${DIGEST_ENABLED:true}
    cron: ${DIGEST_CRON:0 15 * * * *}
  delivery:
    circuit-breaker:
      # Opens after N consecutive retryable provider failures, stays open for the cooldown.
      failure-threshold: ${CIRCUIT_BREAKER_FAILURE_THRESHOLD:5}
      open-cooldown-seconds: ${CIRCUIT_BREAKER_OPEN_COOLDOWN_SECONDS:60}
  kafka:
    lag:
      # Consumer-lag gauges for dashboards/autoscaling (kafka.consumer.lag{group=...}).
      monitored-groups: ${KAFKA_LAG_MONITORED_GROUPS:notification-platform-events}
      poll-interval-ms: ${KAFKA_LAG_POLL_INTERVAL_MS:30000}
  providers:
    # Informational flag; actual provider selection is via the Spring `local` profile
    # (SPRING_PROFILES_ACTIVE=local activates MockEmail/Sms/Push providers).
    mock-enabled: ${MOCK_PROVIDERS_ENABLED:false}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    requests-per-minute: ${RATE_LIMIT_PER_MINUTE:300}
    auth-requests-per-minute: ${AUTH_RATE_LIMIT_PER_MINUTE:30}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
