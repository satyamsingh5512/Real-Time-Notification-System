# Production profile: same shape as `docker`, but with prod-safe switches.
# Activate with SPRING_PROFILES_ACTIVE=prod (see docker-compose.prod.yml).
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://${DB_HOST:?}:${DB_PORT:5432}/${DB_NAME:?}
    username: ${DB_USER:?}
    password: ${DB_PASSWORD:?}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:?}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:?}

server:
  forward-headers-strategy: framework
  tomcat:
    connection-timeout: 5s
    max-http-form-post-size: 1MB

springdoc:
  # Keep Swagger available in prod for the demo; restrict at nginx if needed.
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    root: INFO
    com.uber.notification: INFO
